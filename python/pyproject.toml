[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "anjo-core"
version = "0.1.0"
description = "Deterministic affect-state kernel for long-lived AI characters, with injected adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anjo" }]
keywords = [
  "affect",
  "appraisal",
  "emotion",
  "pad",
  "occ",
  "memory",
  "agent",
  "companion",
  "npc",
  "character",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kevindechang/anjo-core"
Repository = "https://github.com/kevindechang/anjo-core"
Issues = "https://github.com/kevindechang/anjo-core/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "editables>=0.3",
  "hatchling==1.32.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anjo_core"]

[tool.hatch.build.targets.sdist.force-include]
"../shared/golden/kernel_golden.json" = "tests/fixtures/kernel_golden.json"
"../shared/golden/continuity_traces.json" = "tests/fixtures/continuity_traces.json"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E741"] # O is the conventional Big Five openness field.

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["anjo_core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
