name: Release

# Publishes both runtimes from one tag. The full check suite must pass first, so
# a tag can never publish something CI would have rejected.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 24, not the minimum 20: scripts/check.sh runs the coverage reporter,
          # which crashes on Node 20. See the note in ci.yml.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: python -m pip install --require-hashes -r python/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./python
      - run: npm ci --ignore-scripts --prefix typescript
      - run: ./scripts/check.sh
      - name: Confirm the tag matches both package versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version'])")
          ts=$(node -p "require('./typescript/package.json').version")
          init=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('python/src/anjo_core/__init__.py').read_text()).group(1))")
          echo "tag=$tag python=$py typescript=$ts __version__=$init"
          test "$tag" = "$py" && test "$tag" = "$ts" && test "$tag" = "$init"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      # Required for PyPI Trusted Publishing; no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r python/requirements-dev.lock
      # --no-isolation keeps the build on the hash-pinned toolchain instead of
      # letting pip resolve an unpinned hatchling at build time.
      - run: python -m build --no-isolation --outdir dist ./python
      - run: python -m twine check --strict dist/*
      - run: python -m check_wheel_contents dist/*.whl
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      # Required for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 24, not the minimum 20: scripts/check.sh runs the coverage reporter,
          # which crashes on Node 20. See the note in ci.yml.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --prefix typescript
      - run: npm run build --prefix typescript
      - run: npm publish ./typescript --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
