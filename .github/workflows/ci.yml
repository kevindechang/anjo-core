name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_public_boundary.py
      - name: Scan full history with Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements-dev.lock
      - run: python -m pip install --require-hashes -r python/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./python
      - run: python -m pytest python/tests scripts/tests --cov=affect_kernel --cov-branch --cov-report=term-missing
      - run: python -m ruff check python scripts examples bench
      - run: python -m ruff format --check python scripts examples bench
      - run: python -m mypy --config-file python/pyproject.toml python/src
      # Examples are executable documentation and assert their own invariants.
      - run: python examples/python-headless/main.py
      - run: python examples/game-npc/main.py
      # The benchmark report is generated; fail if the committed numbers drifted.
      - run: python bench/run.py --check

  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-dev.lock
      - run: python -m pip install --require-hashes -r python/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./python
      - run: ./scripts/verify_python_package.sh

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 20 is the minimum this package declares in "engines"; 24 is current.
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts --prefix typescript
      - run: npm test --prefix typescript
      - run: npm run typecheck --prefix typescript
      # Node 20's --experimental-test-coverage reporter crashes on source-mapped
      # output ("Cannot read properties of undefined (reading 'line')") and takes
      # the exit code with it, even when every test passes. The suite itself runs
      # on 20 above; only the coverage report is restricted to a Node that can
      # produce it.
      - run: npm run test:coverage --prefix typescript
        if: matrix.node-version == 24
      - run: npm run example --prefix typescript
      - run: npm pack --dry-run ./typescript
      - run: npm audit --omit=dev --prefix ./typescript
